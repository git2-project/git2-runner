syntax = "proto3";

package ci.v1;

import "google/protobuf/timestamp.proto";

// SecretService stores CI secrets: values that jobs get as environment
// variables, such as deploy keys and API tokens.
//
// Values are write-only. No RPC returns a value; only running jobs get
// them, and the runner masks them in the log. ci-svc keeps them encrypted
// with a key that is not in the database.
//
// Callers: admin-api (instance secrets, for instance admins) and dash-api
// (repository secrets, for users who may change the repository's
// settings). The caller checks the user's permissions before calling.
//
// A job gets the instance's secrets and its repository's secrets. When
// both have a secret with the same name, the repository's wins.
service SecretService {
  // SetSecret creates a secret, or replaces the value of an existing one
  // with the same scope and name.
  //
  // Errors:
  //   - INVALID_ARGUMENT: a field breaks the rules on SetSecretRequest.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);

  // ListSecrets returns one page of the secrets of a scope, sorted by
  // name. Values are never returned.
  //
  // Errors:
  //   - INVALID_ARGUMENT: scope or scope_id is invalid, page_size is
  //     negative, or page_token is invalid or was issued for another scope.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // DeleteSecret deletes a secret. Jobs that already started keep the
  // value they got.
  //
  // Errors:
  //   - INVALID_ARGUMENT: scope, scope_id or name is invalid.
  //   - NOT_FOUND: the scope has no secret with this name.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

// SecretScope says which jobs get a secret.
enum SecretScope {
  // Never used.
  SECRET_SCOPE_UNSPECIFIED = 0;
  // Every job of the instance. scope_id is empty.
  SECRET_SCOPE_INSTANCE = 1;
  // Every job of one repository. scope_id is the repository ID.
  SECRET_SCOPE_REPOSITORY = 2;
}

// Secret is a secret's metadata. It never holds the value.
message Secret {
  // Which jobs get the secret.
  SecretScope scope = 1;

  // ID of the repository for SECRET_SCOPE_REPOSITORY, empty for
  // SECRET_SCOPE_INSTANCE.
  string scope_id = 2;

  // Name of the environment variable the job gets.
  string name = 3;

  // When the secret was created.
  google.protobuf.Timestamp created_at = 4;

  // When its value was last set.
  google.protobuf.Timestamp updated_at = 5;
}

// SetSecretRequest is the input of SetSecret.
message SetSecretRequest {
  // Which jobs get the secret. Required.
  SecretScope scope = 1;

  // Repository ID for SECRET_SCOPE_REPOSITORY; must be empty for
  // SECRET_SCOPE_INSTANCE.
  string scope_id = 2;

  // Name of the environment variable. 1 to 100 characters from A-Z, 0-9
  // and "_", not starting with a digit, and not starting with "CI_" or
  // "GIT2_", which git2 reserves. Required.
  string name = 3;

  // The value. 1 byte to 32 KiB, without NUL characters. Required.
  string value = 4;
}

// SetSecretResponse is the output of SetSecret.
message SetSecretResponse {
  // The secret's metadata.
  Secret secret = 1;

  // True if the secret was created, false if its value was replaced.
  bool created = 2;
}

// ListSecretsRequest is the input of ListSecrets.
message ListSecretsRequest {
  // The scope to list. Required.
  SecretScope scope = 1;

  // Repository ID for SECRET_SCOPE_REPOSITORY; must be empty for
  // SECRET_SCOPE_INSTANCE.
  string scope_id = 2;

  // Maximum number of secrets to return. 0 means the default of 50.
  // Values above 100 are treated as 100. Negative values are rejected.
  int32 page_size = 3;

  // Token from a previous response's next_page_token. Empty for the first
  // page. Tokens are opaque and only valid for the same scope.
  string page_token = 4;
}

// ListSecretsResponse is the output of ListSecrets.
message ListSecretsResponse {
  // Secrets on this page, sorted by name.
  repeated Secret secrets = 1;

  // Token for the next page. Empty if this is the last page.
  string next_page_token = 2;
}

// DeleteSecretRequest is the input of DeleteSecret.
message DeleteSecretRequest {
  // The secret's scope. Required.
  SecretScope scope = 1;

  // Repository ID for SECRET_SCOPE_REPOSITORY; must be empty for
  // SECRET_SCOPE_INSTANCE.
  string scope_id = 2;

  // Name of the secret. Required.
  string name = 3;
}

// DeleteSecretResponse is the output of DeleteSecret. It is empty on
// purpose, so fields can be added later without breaking callers.
message DeleteSecretResponse {}
